apiVersion: v1
kind: Secret
metadata:
  name: mindarena-secrets
  namespace: mindarena
type: Opaque
stringData:
  db-username: replace-with-db-user
  db-password: replace-with-db-password
  db-root-password: replace-with-db-root-password
  rabbitmq-username: replace-with-rabbitmq-user
  rabbitmq-password: replace-with-rabbitmq-password
  grafana-admin-user: replace-with-grafana-admin
  grafana-admin-password: replace-with-grafana-password
  jwt-private-key: replace-with-base64-pkcs8-rsa-private-key
  jwt-public-key: replace-with-base64-x509-rsa-public-key
  submission-service-client-id: mindarena-submission-service
  submission-service-client-secret: replace-with-high-entropy-service-secret
  submission-service-client-secret-sha256: replace-with-sha256-of-service-secret
