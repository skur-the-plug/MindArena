spring.application.name=${SERVICE_NAME:mindarena-submission-service}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/mindarena}
spring.datasource.username=${DB_USERNAME:mindarena}
spring.datasource.password=${DB_PASSWORD:mindarena}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
mindarena.jwt.public-key=${JWT_PUBLIC_KEY:}
mindarena.jwt.issuer=mindarena-identity-service
mindarena.service-client.client-id=${SUBMISSION_SERVICE_CLIENT_ID:}
mindarena.service-client.client-secret=${SUBMISSION_SERVICE_CLIENT_SECRET:}
mindarena.service-client.identity-base-url=${IDENTITY_SERVICE_BASE_URL:http://mindarena-identity-service}
mindarena.service-client.challenge-base-url=${CHALLENGE_SERVICE_BASE_URL:http://mindarena-challenge-service}
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
logging.pattern.level=%5p [corr:%X{correlationId:-}]
