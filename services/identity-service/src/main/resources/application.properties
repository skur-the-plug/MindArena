spring.application.name=${SERVICE_NAME:mindarena-identity-service}
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/mindarena}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true

mindarena.jwt.private-key=${JWT_PRIVATE_KEY:}
mindarena.jwt.public-key=${JWT_PUBLIC_KEY:}
mindarena.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
mindarena.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
